<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Base Navy Slate (From Beiwen) -->
    <radialGradient id="navySlateBase" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#05060A" />
    </radialGradient>

    <!-- Aerospace-grade Metallic Steel Foreground Gradient (From Beiwen) -->
    <linearGradient id="solidTitanium" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#CBD5E1" />
      <stop offset="75%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Structurally distinct horizontal metallic gradient for mark line (enhanced brilliance, less dark matte) -->
    <linearGradient id="markTitanium" x1="262" y1="462" x2="762" y2="562" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- HIG Studio Soft Shadow (From Beiwen) -->
    <filter id="higShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Deep Gradient Background -->
  <rect width="1024" height="1024" fill="url(#navySlateBase)"/>

  <!-- Foreground Icons with Metallic Titanium Gradient and Soft Shadow -->
  <g stroke="url(#solidTitanium)" stroke-width="80" fill="none" filter="url(#higShadow)">
    <g id="magnet-top">
      <path d="M 362,436 L 362,350 A 150,150 0 0 1 662,350 L 662,436" stroke-linecap="butt" stroke-linejoin="round" />
    </g>
    <g id="mark-line">
      <line x1="262" y1="512" x2="762" y2="512" stroke="url(#markTitanium)" stroke-linecap="round" />
    </g>
    <g id="magnet-bottom">
      <path d="M 362,588 L 362,674 A 150,150 0 0 0 662,674 L 662,588" stroke-linecap="butt" stroke-linejoin="round" />
    </g>
  </g>
</svg>
