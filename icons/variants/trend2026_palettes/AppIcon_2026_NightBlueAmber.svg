<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Scheme 2: Night Blue + Warm Amber -->
  <!-- 贴近"深夜会议室"的产品叙事，蓝色=持续录音，琥珀=那一刻的高亮打点 -->
  <rect width="1024" height="1024" fill="#080F1E" />
  
  <g id="magnet-top">
    <!-- 钢蓝色 (Steel Blue): 沉稳专注，代表信任与清晰的商务场景 -->
    <path d="M 362,436 L 362,350 A 150,150 0 0 1 662,350 L 662,436" fill="none" stroke="#60A5FA" stroke-width="80" stroke-linecap="butt" stroke-linejoin="round" />
  </g>
  <g id="mark-line">
    <!-- 琥珀暖橙 (Warm Amber): 温暖的高光打点，对比强烈却不刺眼，传递出高端感 -->
    <line x1="262" y1="512" x2="762" y2="512" stroke="#F59E0B" stroke-width="80" stroke-linecap="round" />
  </g>
  <g id="magnet-bottom">
    <path d="M 362,588 L 362,674 A 150,150 0 0 0 662,674 L 662,588" fill="none" stroke="#60A5FA" stroke-width="80" stroke-linecap="butt" stroke-linejoin="round" />
  </g>
</svg>