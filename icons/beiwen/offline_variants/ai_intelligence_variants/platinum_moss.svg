<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Organic Deep Forest Stone Radial Gradient -->
    <radialGradient id="forestGlow" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#141E1B" />
      <stop offset="100%" stop-color="#050807" />
    </radialGradient>
    
    <!-- Satin Platinum & Premium Liquid-Silver Gradient -->
    <linearGradient id="platinumSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Professional Studio Soft Lighting Shadow -->
    <filter id="studioShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Element 1: Mossy Granite Dark Green-Grey Background -->
  <rect width="1024" height="1024" fill="url(#forestGlow)"/>

  <!-- Element 2: Signal Arch & Diamond in Dawn Liquid-Silver -->
  <path d="M 256 704 Q 512 192 768 704 M 512 600 L 552 640 L 512 680 L 472 640 Z" fill="none" stroke="url(#platinumSilver)" stroke-width="96" stroke-linecap="round" stroke-linejoin="round" filter="url(#studioShadow)"/>
</svg>