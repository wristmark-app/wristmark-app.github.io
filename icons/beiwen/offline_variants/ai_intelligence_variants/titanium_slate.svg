<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Intense Volcanic Dark / Obsidian Slate Radial Shadow -->
    <radialGradient id="titaniumGlow" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1E2026" />
      <stop offset="100%" stop-color="#0A0B0E" />
    </radialGradient>
    
    <!-- Aerospace-grade Titanium & Charcoal Steel Gradient -->
    <linearGradient id="titaniumSlate" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="40%" stop-color="#CBD5E1" />
      <stop offset="75%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- HIG Studio Soft Shadow -->
    <filter id="aerospaceShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Element 1: Industrial Micro-brushed Titanium Base -->
  <rect width="1024" height="1024" fill="url(#titaniumGlow)"/>

  <!-- Element 2: Signal Arch & Diamond in Industrial Sterling Steel -->
  <path d="M 256 704 Q 512 192 768 704 M 512 600 L 552 640 L 512 680 L 472 640 Z" fill="none" stroke="url(#titaniumSlate)" stroke-width="96" stroke-linecap="round" stroke-linejoin="round" filter="url(#aerospaceShadow)"/>
</svg>