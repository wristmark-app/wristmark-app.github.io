<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient representing a dramatic Solar Eclipse / Asymmetric contrast line -->
    <!-- Lower half is deep charcoal obsidian, upper center glows with an intense bronze sunburst horizon line -->
    <radialGradient id="eclipseBase" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#4F1D0A" /> <!-- Molten Lava Hearth (Glow origin) -->
      <stop offset="35%" stop-color="#1F130E" /> <!-- Smolding ash transitions -->
      <stop offset="70%" stop-color="#0E0F12" /> <!-- Slate Deep Obsidian -->
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>

    <!-- Linear horizon split overlay inside container to create a subtle volumetric dust light ray -->
    <pattern id="horizonBacklight" width="1024" height="1024" patternUnits="userSpaceOnUse">
      <rect width="1024" height="1024" fill="url(#eclipseBase)"/>
      <!-- Soft asymmetrical organic light rays slicing the top-right to create extreme photographic depth -->
      <path d="M 400 -50 L 1200 450 L 1200 -50 Z" fill="#F59E0B" opacity="0.05" style="mix-blend-mode: screen; filter: blur(40px);"/>
    </pattern>

    <!-- Aerospace-grade Metallic Steel Foreground Gradient -->
    <linearGradient id="solidTitanium" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#CBD5E1" />
      <stop offset="75%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- HIG Studio Soft Shadow -->
    <filter id="higShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Element 1: Horizon Eclipse Contrast Backlight Background -->
  <rect width="1024" height="1024" fill="url(#horizonBacklight)"/>

  <!-- Element 2: Signal Arch & Diamond Main Node -->
  <path d="M 256 704 Q 512 192 768 704 M 512 600 L 552 640 L 512 680 L 472 640 Z" fill="none" stroke="url(#solidTitanium)" stroke-width="96" stroke-linecap="round" stroke-linejoin="round" filter="url(#higShadow)"/>
</svg>