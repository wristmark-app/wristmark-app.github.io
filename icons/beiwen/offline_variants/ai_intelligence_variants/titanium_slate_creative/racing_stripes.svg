<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Solid Dark Steel Base Gradient -->
    <radialGradient id="slateBase" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1E2026" />
      <stop offset="100%" stop-color="#07080A" />
    </radialGradient>

    <!-- Asymmetric Racing Stripe Pattern containing both background and contrasting accents -->
    <!-- Combining deep metal, safety orange (danger-ready) and thin racing gray stripes -->
    <pattern id="racingStripeBase" width="1024" height="1024" patternUnits="userSpaceOnUse">
      <!-- Base Layer -->
      <rect width="1024" height="1024" fill="url(#slateBase)"/>
      
      <!-- Asymmetric diagonal contrasting luxury sport stripes (running behind the arch in the background) -->
      <!-- Orange Warning High-contrast block representing emergency/rescue ready signal -->
      <path d="M 720 -100 L 840 -100 L 440 1124 L 320 1124 Z" fill="#FF5E00" opacity="0.95"/>
      <!-- Soft Slate Accent parallel companion line -->
      <path d="M 870 -100 L 900 -100 L 500 1124 L 470 1124 Z" fill="#4B5563" opacity="0.5"/>
    </pattern>

    <!-- Aerospace-grade Metallic Steel Foreground Gradient -->
    <linearGradient id="solidTitanium" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#CBD5E1" />
      <stop offset="75%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- HIG Studio Soft Shadow -->
    <filter id="higShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-10" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Element 1: Asymmetric Racing Stripe Matte Background -->
  <rect width="1024" height="1024" fill="url(#racingStripeBase)"/>

  <!-- Element 2: Signal Arch & Diamond Main Node -->
  <path d="M 256 704 Q 512 192 768 704 M 512 600 L 552 640 L 512 680 L 472 640 Z" fill="none" stroke="url(#solidTitanium)" stroke-width="96" stroke-linecap="round" stroke-linejoin="round" filter="url(#higShadow)"/>
</svg>