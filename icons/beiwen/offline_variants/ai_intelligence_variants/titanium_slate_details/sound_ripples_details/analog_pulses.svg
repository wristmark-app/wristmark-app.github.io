<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Base Pure Obsidian Gray -->
    <radialGradient id="coalBase" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#191B22" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>

    <!-- Ultra-high-fidelity amplitude-modulated dashed analog tracks (grooves) -->
    <!-- Represents physical tape, micro-groove LP vinyl precision and studio carrier grids -->
    <pattern id="pulseBroadcastingMap" width="1024" height="1024" patternUnits="userSpaceOnUse">
      <rect width="1024" height="1024" fill="url(#coalBase)"/>
      <!-- Converted solid ripples to high-precision micro-pulse dash rays centering at (512, 640) -->
      <!-- Ring 1: High frequency tick marks -->
      <circle cx="512" cy="640" r="160" fill="none" stroke="#64748B" stroke-width="4" stroke-dasharray="1 8" stroke-opacity="0.35"/>
      <!-- Ring 2: Medium frequency pulse dashes -->
      <circle cx="512" cy="640" r="280" fill="none" stroke="#94A3B8" stroke-width="3" stroke-dasharray="16 10" stroke-opacity="0.25"/>
      <!-- Ring 3: Deep spatial coordinate micro ticks -->
      <circle cx="512" cy="640" r="400" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="1 14" stroke-opacity="0.2"/>
      <!-- Ring 4: Combined sync block dashes -->
      <circle cx="512" cy="640" r="520" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="32 16" stroke-opacity="0.15"/>
    </pattern>

    <!-- Aerospace-grade Metallic Steel Foreground Gradient -->
    <linearGradient id="solidTitanium" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#CBD5E1" />
      <stop offset="75%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- HIG Studio Soft Shadow -->
    <filter id="higShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Element 1: High-fidelity Amplitude-Modulated Radio Pulse Track Background -->
  <rect width="1024" height="1024" fill="url(#pulseBroadcastingMap)"/>

  <!-- Element 2: Signal Arch & Diamond Main Node -->
  <path d="M 256 704 Q 512 192 768 704 M 512 600 L 552 640 L 512 680 L 472 640 Z" fill="none" stroke="url(#solidTitanium)" stroke-width="96" stroke-linecap="round" stroke-linejoin="round" filter="url(#higShadow)"/>
</svg>