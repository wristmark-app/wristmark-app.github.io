<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Base Navy Slate -->
    <radialGradient id="navySlateBase" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#05060A" />
    </radialGradient>

    <!-- Translucent Multicolored Spectral Waves + High-Altitude Ambient Dust Particles -->
    <!-- Represents airplane cabin serenity, mountain twilight, and cosmic stardust -->
    <pattern id="highAltitudeStardust" width="1024" height="1024" patternUnits="userSpaceOnUse">
      <rect width="1024" height="1024" fill="url(#navySlateBase)"/>
      
      <!-- Multi-frequency Spectral Waves -->
      <circle cx="512" cy="640" r="160" fill="none" stroke="#10B981" stroke-width="5" stroke-opacity="0.32" style="mix-blend-mode: screen;"/>
      <circle cx="512" cy="640" r="280" fill="none" stroke="#06B6D4" stroke-width="4.5" stroke-opacity="0.26" style="mix-blend-mode: screen;"/>
      <circle cx="512" cy="640" r="400" fill="none" stroke="#8B5CF6" stroke-width="3.5" stroke-opacity="0.2" style="mix-blend-mode: screen;"/>
      <circle cx="512" cy="640" r="520" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-opacity="0.16" style="mix-blend-mode: screen;"/>

      <!-- Delicate, high-density, varying transparency stardust representing flight logs & offline memos -->
      <circle cx="120" cy="180" r="2.5" fill="#FFFFFF" fill-opacity="0.8"/>
      <circle cx="150" cy="320" r="1.5" fill="#E2E8F0" fill-opacity="0.5"/>
      <circle cx="210" cy="110" r="3" fill="#38BDF8" fill-opacity="0.7"/>
      <circle cx="280" cy="220" r="1" fill="#FFFFFF" fill-opacity="0.4"/>
      <circle cx="340" cy="150" r="2" fill="#C084FC" fill-opacity="0.6"/>
      <circle cx="430" cy="90" r="3.5" fill="#FFD700" fill-opacity="0.9"/>
      
      <circle cx="620" cy="100" r="2" fill="#FFFFFF" fill-opacity="0.6"/>
      <circle cx="710" cy="190" r="3" fill="#8B5CF6" fill-opacity="0.8"/>
      <circle cx="780" cy="80" r="1.5" fill="#E2E8F0" fill-opacity="0.4"/>
      <circle cx="860" cy="240" r="2.5" fill="#06B6D4" fill-opacity="0.7"/>
      <circle cx="910" cy="140" r="4" fill="#10B981" fill-opacity="0.9"/>
      <circle cx="800" cy="310" r="1.5" fill="#FFFFFF" fill-opacity="0.5"/>

      <!-- Vertical atmospheric trailing drift particles -->
      <circle cx="490" cy="360" r="2" fill="#8B5CF6" fill-opacity="0.5"/>
      <circle cx="530" cy="300" r="1" fill="#FFFFFF" fill-opacity="0.3"/>
      <circle cx="410" cy="480" r="2.5" fill="#10B981" fill-opacity="0.4"/>
      <circle cx="610" cy="450" r="3" fill="#06B6D4" fill-opacity="0.4"/>
    </pattern>

    <!-- Aerospace-grade Metallic Steel Foreground Gradient -->
    <linearGradient id="solidTitanium" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#CBD5E1" />
      <stop offset="75%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- HIG Studio Soft Shadow -->
    <filter id="higShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Element 1: Serene Airplane Stardust High-Altitude Background Map -->
  <rect width="1024" height="1024" fill="url(#highAltitudeStardust)"/>

  <!-- Element 2: Signal Arch & Diamond Main Node -->
  <path d="M 256 704 Q 512 192 768 704 M 512 600 L 552 640 L 512 680 L 472 640 Z" fill="none" stroke="url(#solidTitanium)" stroke-width="96" stroke-linecap="round" stroke-linejoin="round" filter="url(#higShadow)"/>
</svg>