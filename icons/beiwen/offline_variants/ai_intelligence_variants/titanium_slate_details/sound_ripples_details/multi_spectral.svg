<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Base Navy Slate -->
    <radialGradient id="navySlateBase" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#05060A" />
    </radialGradient>

    <!-- Translucent Multicolored Spectral Waves -->
    <!-- Symbolizes separate speakers, emotional speech synthesis & voiceprint security -->
    <pattern id="multiSpectralMap" width="1024" height="1024" patternUnits="userSpaceOnUse">
      <rect width="1024" height="1024" fill="url(#navySlateBase)"/>
      
      <!-- Layered offset rings with high-end, extremely premium frosted neon opacities -->
      <!-- Ring 1: Emerald Sound wave (Low frequency/safe) -->
      <circle cx="512" cy="640" r="160" fill="none" stroke="#10B981" stroke-width="5" stroke-opacity="0.32" style="mix-blend-mode: screen;"/>
      <!-- Ring 2: Deep Cyan Sound wave (Middle frequency/voice fundamental) -->
      <circle cx="512" cy="640" r="280" fill="none" stroke="#06B6D4" stroke-width="4.5" stroke-opacity="0.26" style="mix-blend-mode: screen;"/>
      <!-- Ring 3: Lavender Royal Violet wave (AI high-level semantic parsing) -->
      <circle cx="512" cy="640" r="400" fill="none" stroke="#8B5CF6" stroke-width="3.5" stroke-opacity="0.2" style="mix-blend-mode: screen;"/>
      <!-- Ring 4: Amber Sunrise wave (Confidence highlight marker index) -->
      <circle cx="512" cy="640" r="520" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-opacity="0.16" style="mix-blend-mode: screen;"/>
    </pattern>

    <!-- Aerospace-grade Metallic Steel Foreground Gradient -->
    <linearGradient id="solidTitanium" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#CBD5E1" />
      <stop offset="75%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- HIG Studio Soft Shadow -->
    <filter id="higShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Element 1: Multi-Frequency Spectral Soundwave Background -->
  <rect width="1024" height="1024" fill="url(#multiSpectralMap)"/>

  <!-- Element 2: Signal Arch & Diamond Main Node -->
  <path d="M 256 704 Q 512 192 768 704 M 512 600 L 552 640 L 512 680 L 472 640 Z" fill="none" stroke="url(#solidTitanium)" stroke-width="96" stroke-linecap="round" stroke-linejoin="round" filter="url(#higShadow)"/>
</svg>