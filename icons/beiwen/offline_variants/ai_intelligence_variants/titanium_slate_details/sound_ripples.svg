<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Solid backplane fill for the audio studio -->
    <radialGradient id="acousticBase" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1A1C23" />
      <stop offset="100%" stop-color="#08090C" />
    </radialGradient>

    <!-- Concentric Soft Audiowave Ripples to represent Safe Local voice recording and processing -->
    <!-- We pack the concentric ripples inside a single composite background fill to preserve the 2-element tree constraint -->
    <pattern id="acousticWaveMap" width="1024" height="1024" patternUnits="userSpaceOnUse">
      <rect width="1024" height="1024" fill="url(#acousticBase)"/>
      <!-- Concentric sound rings centered at the focal diamond point (512, 640) -->
      <circle cx="512" cy="640" r="160" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.25"/>
      <circle cx="512" cy="640" r="280" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.2"/>
      <circle cx="512" cy="640" r="400" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.15"/>
      <circle cx="512" cy="640" r="520" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.1"/>
    </pattern>

    <!-- Aerospace-grade Metallic Steel Foreground Gradient -->
    <linearGradient id="solidTitanium" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#CBD5E1" />
      <stop offset="75%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Professional Studio Soft Lighting Shadow -->
    <filter id="floatShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Element 1: Acoustic Rippling Soundwave Safe Chamber Background -->
  <rect width="1024" height="1024" fill="url(#acousticWaveMap)"/>

  <!-- Element 2: Signal Arch & Diamond Main Node -->
  <path d="M 256 704 Q 512 192 768 704 M 512 600 L 552 640 L 512 680 L 472 640 Z" fill="none" stroke="url(#solidTitanium)" stroke-width="96" stroke-linecap="round" stroke-linejoin="round" filter="url(#floatShadow)"/>
</svg>